version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceshield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceshield
      POSTGRES_PASSWORD: voiceshield
      POSTGRES_DB: voiceshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: voiceshield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
