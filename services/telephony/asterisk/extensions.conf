; VoiceShield Asterisk Dialplan Configuration
[general]
static=yes
writeprotect=no
clearglobalvars=no

[from-sip]
; Answer the incoming call immediately so media dialog is established, then hand over to Stasis
exten => _X.,1,NoOp(VoiceShield Inbound Call: ${CALLERID(all)} -> ${EXTEN})
 same => n,Answer()
 same => n,Stasis(voiceshield)
 same => n,Hangup()

exten => _[a-zA-Z]!,1,NoOp(VoiceShield Inbound Call (Alpha): ${CALLERID(all)} -> ${EXTEN})
 same => n,Answer()
 same => n,Stasis(voiceshield)
 same => n,Hangup()
