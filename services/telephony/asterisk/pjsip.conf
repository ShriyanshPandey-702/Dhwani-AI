; VoiceShield Asterisk PJSIP Configuration
[global]
type=global
default_from_user=asterisk
user_agent=VoiceShield-Asterisk-20
endpoint_identifier_order=ip,username,anonymous

; ── Transports ─────────────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ── Anonymous Inbound (Permits test calls from any client) ────────────────
[anonymous]
type=endpoint
context=from-sip
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=slin16
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ── Registered Test Caller Endpoint ───────────────────────────────────────
[testcaller]
type=endpoint
context=from-sip
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=slin16
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=testcaller_auth
aors=testcaller_aor

[testcaller_auth]
type=auth
auth_type=userpass
username=testcaller
password=testpassword

[testcaller_aor]
type=aor
max_contacts=2
remove_existing=yes

[testcaller_ident]
type=identify
endpoint=testcaller
match=testcaller
